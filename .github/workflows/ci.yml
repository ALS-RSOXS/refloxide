# Checks that gate a pull request and run again on main. The Release workflow reuses
# this file (workflow_call) so nothing ships on a red tree. Performance is not measured
# here: shared runners are too noisy. Authors paste `make bench-compare` output into
# the PR instead (see CONTRIBUTING.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: "1"

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets --locked
      - name: validate WGSL shaders (naga, no GPU needed)
        run: cargo run -p refloxide-gpu --example gpu_general_check --locked

  python:
    name: python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - name: install (builds the extension once)
        run: make install
      - name: lint, format, types
        run: make lint format-check type-check
      - name: pytest
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests build on Linux only; main also covers macOS and Windows.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          manylinux: ${{ runner.os == 'Linux' && '2_28' || 'auto' }}
          args: --release --out dist --compatibility pypi -i python3.13
      - name: smoke import
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import subprocess
          import sys

          wheel = glob.glob("dist/*.whl")[0]
          subprocess.check_call([sys.executable, "-m", "pip", "install", wheel])
          subprocess.check_call(
              [sys.executable, "-c", "import refloxide, refloxide.rust; print(refloxide.__version__)"]
          )
          PY
      - name: sdist builds
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
