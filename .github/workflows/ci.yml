name: CI

on:
  pull_request:
    branches: [main]
  # Re-validate the prospective merge commit inside the merge queue.
  # No push-to-main: that would duplicate work already done on the PR / queue.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: make install

      - name: Lint and format check
        run: make lint format-check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: make install

      - name: Run ty type checker
        run: make type-check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: make install

      - name: Run tests with coverage
        run: uv run --python ${{ matrix.python-version }} pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile crate
        run: cargo check --all-targets

      - name: Compile crate (gpu feature)
        run: cargo check --all-targets --features gpu

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run clippy (gpu feature)
        run: cargo clippy --all-targets --features gpu -- -D warnings

      - name: Run Rust tests
        run: cargo test --all-targets

      - name: Validate general WGSL shaders (naga)
        run: cargo run --example gpu_general_check --no-default-features

  wheels:
    name: Wheel (${{ matrix.variant }}, ${{ matrix.config.os }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, gpu]
        config:
          - os: ubuntu-22.04
            target: x86_64
            manylinux: "2_28"
          - os: macos-latest
            target: aarch64
            manylinux: auto
          - os: windows-latest
            target: x64
            manylinux: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set PyPI package name for variant
        shell: bash
        run: |
          if [[ "${{ matrix.variant }}" == "gpu" ]]; then
            python scripts/set_pypi_package_name.py refloxide-gpu
          else
            python scripts/set_pypi_package_name.py refloxide
          fi

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.config.target }}
          args: >-
            --release --out dist --compatibility pypi -i python3.13
            --no-default-features
            --features ${{ matrix.variant == 'gpu' && 'python,gpu' || 'python' }}
          manylinux: ${{ matrix.config.manylinux }}

      - name: Assert Linux manylinux tag
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import sys

          wheels = sorted(glob.glob("dist/*.whl"))
          if not wheels:
              sys.exit("no wheel in dist/")
          for path in wheels:
              name = path.rsplit("/", 1)[-1]
              if name.endswith("linux_x86_64.whl"):
                  sys.exit(f"unsupported platform tag in {name}")
              if "manylinux" not in name and "musllinux" not in name:
                  sys.exit(f"expected manylinux/musllinux tag in {name}")
              print(f"OK: {name}")
          PY

      - name: Smoke import
        shell: bash
        run: |
          python -m venv .smoke-venv
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY=.smoke-venv/Scripts/python
            PIP=.smoke-venv/Scripts/pip
          else
            PY=.smoke-venv/bin/python
            PIP=.smoke-venv/bin/pip
          fi
          $PIP install --no-deps dist/*.whl
          $PY - <<'PY'
          import refloxide
          import refloxide.rust as rust
          print(refloxide.__version__, rust.uniaxial_reflectivity.__name__)
          PY
