[workspace]
members = [
    "crates/refloxide-core",
    "crates/refloxide-optics",
    "crates/refloxide-tmm",
    "crates/refloxide-gpu",
    "crates/refloxide-py",
]
resolver = "2"

[workspace.package]
version = "0.3.0-rc.1"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/ALS-RSOXS/refloxide"

[workspace.dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module", "num-complex"] }
numpy = "0.28"
nalgebra = "0.33"
num-complex = "0.4"
num-traits = "0.2"
thiserror = "1.0"
rayon = "1.10"
refloxide-core = { path = "crates/refloxide-core" }
refloxide-optics = { path = "crates/refloxide-optics" }
refloxide-tmm = { path = "crates/refloxide-tmm" }
refloxide-gpu = { path = "crates/refloxide-gpu" }
wgpu = "30.0.1"
pollster = "1"
bytemuck = { version = "1.25.2", features = ["derive"] }
approx = "0.5"
naga = { version = "30", features = ["wgsl-in", "spv-out", "glsl-out", "hlsl-out"] }
lineshapes = { version = "0.1.0", default-features = false }

# Single-codegen-unit optimized profile for benchmarks and precision studies.
[profile.perf]
inherits = "release"
opt-level = 3
codegen-units = 1

[profile.release]
# Keep macOS cdylibs loadable (strip can break LINKEDIT).
strip = "none"
lto = "fat"
codegen-units = 1

